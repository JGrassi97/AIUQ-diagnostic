JOBS:

  GET_GROUND_TRUTH:
    CHECK: on_submission
    FILE: templates/get_ground_truth.sh,templates/config.yml
    PLATFORM: "FELIPE"
    RUNNING: DATE
    DEPENDENCIES: SYNCHRONIZE

  RESAMPLE_GROUND_TRUTH:
    CHECK: on_submission
    FILE: templates/resample_ground_truth.sh,templates/config.yml
    PLATFORM: "FELIPE-GENERAL"
    RUNNING: DATE
    DEPENDENCIES: GET_GROUND_TRUTH
    NODES: 1
    PROCESSORS: 40

  RMSE:
    CHECK: on_submission
    FILE: templates/rmse.sh,templates/config.yml
    PLATFORM: "FELIPE-GENERAL"
    RUNNING: CHUNK
    DEPENDENCIES: RESAMPLE_GROUND_TRUTH POSTPROCESS SIM
    NODES: 1
    PROCESSORS: 20

  MERGER:
    CHECK: on_submission
    FILE: templates/merger.sh,templates/config.yml
    PLATFORM: "FELIPE-NOOVERLAP"
    RUNNING: DATE
    DEPENDENCIES: RMSE
    NODES: 1
    PROCESSORS: 20